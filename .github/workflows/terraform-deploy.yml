name: Terraform Deploy

on:
  workflow_dispatch:

env:
  AWS_REGION: eu-west-2
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  terraform-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: docker build -t aws-ecs-devops-project .
        working-directory: .

      - name: Tag Docker image
        run: docker tag aws-ecs-devops-project:latest 848960888054.dkr.ecr.eu-west-2.amazonaws.com/aws-ecs-devops-project:v6
        working-directory: .

      - name: Push Docker image to ECR
        run: docker push 848960888054.dkr.ecr.eu-west-2.amazonaws.com/aws-ecs-devops-project:v6

      - name: Force ECS new deployment
        run: aws ecs update-service --cluster ecs-devops-cluster --service flask-app-service --force-new-deployment --region eu-west-2